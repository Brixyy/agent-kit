name: testy
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: testy-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -I tests/test_kontext.py
      - run: python -I tests/test_pojistka.py
      - run: python -I tests/test_env_nastav.py
      - run: python -I tests/test_uklid.py

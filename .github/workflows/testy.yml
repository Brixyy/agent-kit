name: testy
on:
  push:
    branches: [main]
  pull_request:
# Stav konceptu ve skupině: běh z konceptu nesmí zrušit kontrolu po `gh pr ready`.
concurrency:
  group: testy-${{ github.event.pull_request.number || github.sha }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -I tests/test_kontext.py
      - run: python -I tests/test_uzivatel.py
      - run: python -I tests/test_pojistka.py
      - run: python -I tests/test_env_nastav.py
      - run: python -I tests/test_uklid.py
      - run: python -I tests/test_pro_tebe.py
      - run: python -I tests/test_vercel_kontrola.py
      - run: python -I tests/test_vercel_ucet.py
      - run: python -I tests/test_stitky.py
